<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interval Timer</title>
  <meta name="description" content="Simple interval timer with sound notification and wake lock support.">
  <style>
    :root {
      --bg: #0b1220;
      --card: rgba(255,255,255,0.08);
      --text: #eef2ff;
      --accent: #67e8f9;
      --muted: rgba(238,242,255,0.72);
      --shadow: 0 16px 50px rgba(0,0,0,0.35);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top left, rgba(103,232,249,0.25), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(165,180,252,0.25), transparent 50%),
                  linear-gradient(140deg, #08101e 0%, #0b1220 100%);
      color: var(--text);
      text-rendering: optimizeLegibility;
    }

    .container {
      width: min(520px, calc(100% - 2rem));
      padding: 2rem;
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.8rem;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .display {
      width: 100%;
      padding: 1.6rem;
      margin: 0.5rem 0 1.2rem;
      border-radius: 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .controls { display: grid; gap: 0.75rem; }

    .row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    input[type=number], select {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border 0.15s ease;
    }

    input[type=number]:focus, select:focus {
      border-color: rgba(103,232,249,0.9);
      box-shadow: 0 0 0 4px rgba(103,232,249,0.16);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 14px;
      padding: 0.9rem 1.1rem;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.01em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .primary {
      background: linear-gradient(135deg, rgba(103,232,249,0.9), rgba(165,180,252,0.9));
      color: #0b1220;
      box-shadow: 0 18px 40px rgba(103,232,249,0.3);
    }

    .primary:active {
      transform: translateY(1px);
      box-shadow: 0 14px 32px rgba(103,232,249,0.25);
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.16);
    }

    .secondary:active {
      transform: translateY(1px);
    }

    .small {
      font-size: 0.9rem;
      padding: 0.7rem 0.9rem;
    }

    .hint {
      margin-top: 1rem;
      font-size: 0.85rem;
      line-height: 1.4;
      color: rgba(238,242,255,0.6);
    }

    .hint a { color: rgba(103,232,249,0.9); }

    @media (max-width: 420px) {
      .display { font-size: 2.4rem; }
      .row { flex-direction: column; }
    }

    .container.fullscreen-mode h1,
    .container.fullscreen-mode .controls {
      display: none;
    }

    .container.fullscreen-mode {
      border: none;
      width: 100vw;
      height: 100vh;
      padding: 0;
      margin: 0;
      border-radius: 0;
      background: transparent;
      max-width: none;
    }

    .container.fullscreen-mode .display {
      font-size: 12rem;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: none;
    }

    @media (max-width: 480px) {
      .container.fullscreen-mode .display {
        font-size: 8rem;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .container.fullscreen-mode .display {
        font-size: 10rem;
      }
    }

    @media (min-width: 769px) and (max-width: 1200px) {
      .container.fullscreen-mode .display {
        font-size: 14rem;
      }
    }

    @media (min-width: 1201px) {
      .container.fullscreen-mode .display {
        font-size: 16rem;
      }
    }
  </style>
</head>
<body>
  <main class="container" role="main">
    <h1>Interval Timer</h1>

    <div class="display" id="countdown">00:30</div>

    <div class="controls">
      <div class="row">
        <label>
          Preset
          <select id="preset" aria-label="Select a preset duration">
            <option value="15">15 seconds</option>
            <option value="30" selected>30 seconds (default)</option>
            <option value="45">45 seconds</option>
            <option value="60">60 seconds</option>
          </select>
        </label>

        <label>
          Custom (seconds)
          <input id="custom" type="number" min="1" max="3600" step="1" value="30" aria-label="Custom timer length in seconds">
        </label>
      </div>

      <div class="row">
        <button class="primary" id="toggle" type="button">Start</button>
        <button class="secondary small" id="reset" type="button">Reset</button>
      </div>

      <div class="row" style="justify-content: space-between;">
        <button class="secondary small" id="wake" type="button">Keep screen awake</button>
        <button class="secondary small" id="fullscreen" type="button">Full Screen</button>
        <span id="status" class="hint" style="margin:0; text-align:right;">Ready</span>
      </div>

      <p class="hint">Tip: Tap anywhere to hide the browser UI on mobile once started. This page uses the Wake Lock API to keep the screen on while the timer is running.</p>
    </div>
  </main>

  <audio id="beep" src="beep.wav" preload="auto"></audio>

  <script>
    const elements = {
      countdown: document.getElementById('countdown'),
      preset: document.getElementById('preset'),
      custom: document.getElementById('custom'),
      toggle: document.getElementById('toggle'),
      reset: document.getElementById('reset'),
      wake: document.getElementById('wake'),
      fullscreen: document.getElementById('fullscreen'),
      status: document.getElementById('status'),
      beep: document.getElementById('beep'),
      container: document.querySelector('.container'),
    };

    let intervalId = null;
    let remainingSeconds = 30;
    let cycleSeconds = 30;
    let wakeLock = null;

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function setDuration(seconds) {
      cycleSeconds = Math.max(1, Math.min(3600, Math.trunc(seconds)));
      remainingSeconds = cycleSeconds;
      elements.countdown.textContent = formatTime(remainingSeconds);
    }

    function updateStatus(text) {
      elements.status.textContent = text;
    }

    function tryWakeLock() {
      if (!('wakeLock' in navigator)) {
        updateStatus('Wake Lock API not supported');
        return;
      }

      navigator.wakeLock.request('screen').then(lock => {
        wakeLock = lock;
        updateStatus('Screen will stay awake');

        // Re-request on visibility change
        document.addEventListener('visibilitychange', handleVisibilityChange);

        lock.addEventListener('release', () => {
          wakeLock = null;
          updateStatus('Wake lock released');
        });
      }).catch(err => {
        updateStatus('Wake lock failed: ' + (err.message || err));
      });
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().catch(() => {}).finally(() => {
          wakeLock = null;
          updateStatus('Wake lock released');
        });
      }
      document.removeEventListener('visibilitychange', handleVisibilityChange);
    }

    function handleVisibilityChange() {
      if (document.visibilityState === 'visible' && intervalId && !wakeLock) {
        tryWakeLock();
      }
    }

    let audioContext = null;

    function ensureAudioContext() {
      if (!audioContext) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          audioContext = new AudioCtx();
        }
      }
      return audioContext;
    }

    function playTone(freq = 880, duration = 0.15) {
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = freq;
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.01);
      oscillator.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      oscillator.stop(ctx.currentTime + duration + 0.02);
    }

    function unlockAudio() {
      // Attempt to unlock audio using a user gesture so later plays will work.
      const ctx = ensureAudioContext();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }

      elements.beep.play().then(() => {
        elements.beep.pause();
        elements.beep.currentTime = 0;
      }).catch(() => {
        // Some browsers still require a gesture at the moment of play.
      });
    }

    function playBeep() {
      elements.beep.currentTime = 0;
      elements.beep.play().catch(() => {
        // Fallback to Web Audio if audio element is blocked.
        playTone();
      });
    }

    function tick() {
      if (remainingSeconds <= 0) {
        playBeep();
        remainingSeconds = cycleSeconds;
      } else {
        remainingSeconds -= 1;
      }
      elements.countdown.textContent = formatTime(remainingSeconds);
    }

    function startTimer() {
      if (intervalId) return;
      unlockAudio();
      intervalId = window.setInterval(tick, 1000);
      elements.toggle.textContent = 'Stop';
      updateStatus('Running • will repeat every ' + formatTime(cycleSeconds));
      tryWakeLock();
    }

    function stopTimer() {
      if (!intervalId) return;
      clearInterval(intervalId);
      intervalId = null;
      elements.toggle.textContent = 'Start';
      updateStatus('Stopped');
      releaseWakeLock();
    }

    function applySettings() {
      const presetSeconds = Number(elements.preset.value);
      const customSeconds = Number(elements.custom.value);
      if (!Number.isFinite(customSeconds) || customSeconds < 1) {
        elements.custom.value = String(presetSeconds);
        setDuration(presetSeconds);
        return;
      }

      // If the user changed custom value, use it.
      if (customSeconds !== presetSeconds) {
        setDuration(customSeconds);
        return;
      }

      setDuration(presetSeconds);
    }

    elements.preset.addEventListener('change', () => {
      elements.custom.value = elements.preset.value;
      if (!intervalId) applySettings();
    });

    elements.custom.addEventListener('input', () => {
      const customSeconds = Number(elements.custom.value);
      if (Number.isFinite(customSeconds) && customSeconds >= 1) {
        if (!intervalId) setDuration(customSeconds);
      }
    });

    elements.toggle.addEventListener('click', () => {
      if (intervalId) {
        stopTimer();
      } else {
        // Ensure duration matches custom/preset immediately
        applySettings();
        startTimer();
      }
    });

    elements.reset.addEventListener('click', () => {
      stopTimer();
      applySettings();
    });

    elements.wake.addEventListener('click', () => {
      if (wakeLock) {
        releaseWakeLock();
      } else {
        tryWakeLock();
      }
    });

    elements.fullscreen.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.documentElement.requestFullscreen();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        elements.container.classList.add('fullscreen-mode');
      } else {
        elements.container.classList.remove('fullscreen-mode');
      }
    });

    elements.countdown.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
    });

    // Keep the display in sync when user focus on the page
    window.addEventListener('focus', () => {
      elements.countdown.textContent = formatTime(remainingSeconds);
    });

    // Initialize display
    setDuration(30);
  </script>
</body>
</html>
