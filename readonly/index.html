<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Read Only</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: radial-gradient(circle at 20% 20%, #fbe9d7, #f3f4f6 35%, #e1e8f5);
      --panel: #0f172a;
      --accent: #f97316;
      --muted: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: #0b1021;
      font-family: 'Lora', serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(980px, 100%);
      background: var(--panel);
      color: #e2e8f0;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.28);
      border: 1px solid rgba(226, 232, 240, 0.08);
    }
    .layout {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 18px;
      align-items: start;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
      letter-spacing: 0.4px;
    }
    .meta {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }
    .meta a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px dotted rgba(249, 115, 22, 0.5);
    }
    .meta a:hover { text-decoration: underline; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 6px rgba(249, 115, 22, 0.18);
    }
    .list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 60vh;
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .list::-webkit-scrollbar { display: none; }
    .item {
      text-align: left;
      width: 100%;
      border: 1px solid rgba(226, 232, 240, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      padding: 12px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      font-family: 'Space Mono', monospace;
      font-size: 0.92rem;
      line-height: 1.35;
    }
    .item:hover {
      border-color: rgba(249, 115, 22, 0.4);
      background: rgba(255, 255, 255, 0.07);
    }
    .item.active {
      border-color: var(--accent);
      background: rgba(249, 115, 22, 0.12);
    }
    pre {
      margin: 0;
      padding: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.08);
      border-radius: 14px;
      font-family: 'Space Mono', monospace;
      font-size: 0.98rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
      color: #f8fafc;
      max-height: 60vh;
      overflow: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    pre::-webkit-scrollbar { display: none; }
    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .list-col, .content-col {
      display: flex;
      flex-direction: column;
    }
    .content-col { padding-top: 10px; }
    @media (max-width: 840px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 640px) {
      body { padding: 16px; }
      .card { padding: 20px; }
      h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Read Only</h1>
    <div class="meta"><span class="dot" aria-hidden="true"></span><span id="source"></span></div>
    <div class="layout">
      <div class="list-col">
        <h2 style="margin:0 0 10px;font-size:1.05rem;letter-spacing:0.2px;color:var(--muted);"></h2>
        <ul class="list" id="list"></ul>
      </div>
      <div class="content-col">
        <pre id="content">Select a file from the list</pre>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <script>
    let resources = [];
    const listEl = document.getElementById('list');
    const contentEl = document.getElementById('content');
    const statusEl = document.getElementById('status');
    const sourceEl = document.getElementById('source');

    async function loadDirectory() {
      statusEl.textContent = 'Reading directory…';
      try {
        // Prefer a static JSON listing (works on GitHub Pages)
        let links = [];
        try {
          const jres = await fetch('list.json');
          if (jres.ok) {
            const arr = await jres.json();
            if (Array.isArray(arr) && arr.length) links = arr.map(String);
          }
        } catch (e) {
          // ignore and fall back to directory listing
        }

        // Try a static listing inside the res/ directory as a fallback (GitHub Pages may publish this)
        if (!links.length) {
          try {
            const jr = await fetch('res/list.json');
            if (jr.ok) {
              const arr = await jr.json();
              if (Array.isArray(arr) && arr.length) links = arr.map(String);
            }
          } catch (e) {
            // ignore
          }
        }

        // Fallback: try directory HTML listing (local dev servers)
        if (!links.length) {
          const res = await fetch('res/');
          if (!res.ok) throw new Error('Failed to read directory, status ' + res.status);
          const html = await res.text();
          const doc = new DOMParser().parseFromString(html, 'text/html');
          links = Array.from(doc.querySelectorAll('a'))
            .map(a => a.getAttribute('href'))
            .filter(href => href && !href.startsWith('?') && !href.startsWith('/'))
            .filter(href => !href.endsWith('/'));
        }

        if (!links.length) throw new Error('no listing found');

        resources = links.map(href => {
          const clean = href.replace(/^\.\/?/, '');
          // decodeURIComponent can throw on malformed percent-escapes (e.g. bare '%').
          // Try to decode, if it fails fall back to a safe replacement or the raw value.
          let name;
          try {
            name = decodeURIComponent(clean);
          } catch (e) {
            try {
              // Escape bare '%' and try again
              name = decodeURIComponent(clean.replace(/%/g, '%25'));
            } catch (e2) {
              name = clean; // last resort: use raw string
            }
          }
          return { name, path: 'res/' + clean };
        });

        // Sort by date (descending) using filename epoch when available
        resources.sort((a, b) => getSortTime(b.name) - getSortTime(a.name));

        renderList();
        if (resources.length) {
          selectResource(0);
        } else {
          statusEl.textContent = 'Directory is empty';
        }
      } catch (err) {
        statusEl.textContent = 'Failed to load directory: ' + err.message;
        contentEl.textContent = 'Unable to read res directory. Add a `list.json` or allow directory listings.';
      }
    }

    function prettyName(name) {
      const withoutExt = name.replace(/\.[^.]+$/, '');
      const withoutBV = withoutExt.replace(/\s*[\[\u3010](BV[0-9A-Za-z]+)[\]\u3011]\s*$/, '');
      return withoutBV.trim();
    }

    // Parse filenames shaped as: title-BVxxxxxxxx-<epoch>(.txt)
    function parseFromFilename(name) {
      const base = name.replace(/\.[^.]+$/, '');
      const m = base.match(/^(.+?)-(BV[0-9A-Za-z]+)-([0-9]{10,13})$/);
      if (m) {
        return { title: m[1], bvid: m[2], ts: Number(m[3]) };
      }
      return null;
    }

    function shortDateFromTS(ts) {
      let ms = ts;
      if (String(ts).length === 10) ms = ts * 1000; // seconds -> ms
      const d = new Date(ms);
      const yy = String(d.getFullYear()).slice(2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function getSortTime(name) {
      const parsed = parseFromFilename(name);
      if (parsed && parsed.ts) {
        return String(parsed.ts).length === 10 ? parsed.ts * 1000 : parsed.ts;
      }
      // Fallback: try ISO date in brackets [YYYY-MM-DD]
      const m = name && name.match(/\[([0-9]{4}-[0-9]{2}-[0-9]{2})\]/);
      if (m) {
        const t = Date.parse(m[1] + 'T00:00:00Z');
        return isNaN(t) ? 0 : t;
      }
      return 0;
    }

    function displayTitle(name) {
      const parsed = parseFromFilename(name);
      if (parsed) {
        const shortDate = shortDateFromTS(parsed.ts);
        return `[${shortDate}] ${parsed.title}`;
      }
      return prettyName(name);
    }

    function renderList() {
      listEl.innerHTML = '';
      resources.forEach((file, idx) => {
        const btn = document.createElement('button');
        btn.className = 'item';
        btn.type = 'button';
        btn.textContent = displayTitle(file.name);
        btn.dataset.index = String(idx);
        btn.addEventListener('click', () => selectResource(idx));
        listEl.appendChild(btn);
      });
    }

    function extractBV(name) {
      if (!name) return null;
      const base = String(name).replace(/\.[^.]+$/, '');
      // Hyphen-separated pattern: title-BVxxxx-timestamp.txt
      let m = base.match(/-(BV[0-9A-Za-z]+)-/);
      if (m) return m[1];
      // Bracketed patterns: [BVxxxx] or 【BVxxxx】
      m = base.match(/\[(BV[0-9A-Za-z]+)\]|[\u3010](BV[0-9A-Za-z]+)[\u3011]/);
      if (m) return m[1] || m[2];
      // Fallback: any standalone BV token
      m = base.match(/(BV[0-9A-Za-z]{8,})/);
      return m ? m[1] : null;
    }

    async function selectResource(index) {
      const file = resources[index];
      listEl.querySelectorAll('.item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      const parsed = parseFromFilename(file.name);
      const bv = parsed ? parsed.bvid : extractBV(file.name);
      if (bv) {
        const url = 'https://www.bilibili.com/video/' + bv;
        sourceEl.innerHTML = 'Source: <a href="' + url + '" target="_blank" rel="noopener noreferrer">www.bilibili.com/video/' + bv + '</a>';
      } else {
        sourceEl.textContent = 'Source: ';
      }
      await loadText(file.path);
    }

    async function loadText(path) {
      statusEl.textContent = '';
      try {
        const res = await fetch(path);
        if (!res.ok) {
          throw new Error('Failed to fetch file, status ' + res.status);
        }
        const text = await res.text();
        contentEl.textContent = text.trim();
        contentEl.scrollTop = 0;
        statusEl.textContent = '';
      } catch (err) {
        contentEl.textContent = 'Unable to load file content.';
        statusEl.textContent = err.message;
      }
    }

    loadDirectory();
  </script>
</body>
</html>
