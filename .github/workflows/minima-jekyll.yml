name: Minima Jekyll CI

on:
  push:
    paths:
      - 'minima/**'
  pull_request:
    paths:
      - 'minima/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-version: '2.6.9'
          cache: 'bundler'

      - name: Install dependencies
        run: |
          cd minima
          bundle install --jobs 4 --retry 3

      - name: Build Minima site
        run: |
          cd minima
          bundle exec jekyll build --config _config_theme-dev.yml --destination ../1zZ
