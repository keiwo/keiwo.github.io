<script>

function throttle(fn, delay, atleast) {

  var timeout = null,

startTime = new Date();

  return function() {

var curTime = new Date();

clearTimeout(timeout);

if(curTime - startTime >= atleast) {

    fn();

    startTime = curTime;

}else {

    timeout = setTimeout(fn, delay);

}

  }

}

function lazyload() {

  var images = document.getElementsByTagName('img');

  var len    = images.length;

  var n      = 0;      //存储图片加载到的位置，避免每次都从第一张图片开始遍历

  return function() {

var seeHeight = document.documentElement.clientHeight;

var scrollTop = document.documentElement.scrollTop || document.body.scrollTop;

for(var i = n; i < len; i++) {

    if(images[i].offsetTop < seeHeight + scrollTop) {

        if(images[i].getAttribute('src') === 'img/1.gif') {

       images[i].src = images[i].getAttribute('data-src');

        }

  n = n + 1;

     }

}

  }

}

var loadImages = lazyload();

loadImages();          //初始化首页的页面图片

window.addEventListener('scroll', throttle(loadImages, 500, 1000), false);

</script>

<script>

var images = [];

for(var i=1; i<=76; i++){

  if(i !== 8) images.push(i);

}

images.reverse(); // to match original order 61 to 1

$(document).ready(function(){

  var classes = {
    1: 'lorem',
    2: 'adipiscing',
    3: 'lorem',
    4: 'dolor',
    5: 'dolor',
    6: 'adipiscing',
    7: 'lorem',
    9: 'adipiscing',
    10: 'adipiscing',
    11: 'lorem',
    12: 'dolor',
    13: 'dolor',
    14: 'adipiscing',
    15: 'lorem',
    16: 'lorem'
  };

  var html = '';

  images.forEach(function(num){

    var cls = classes[num] || 'adipiscing';

    html += `<div class="col-sm-6 col-md-4 ${cls}">

          <div class="portfolio-item">

            <div class="hover-bg"> <a href="img/portfolio/${num}-large.jpg" class="nivo-lightbox" data-lightbox-gallery="gallery1">

              <div class="hover-text">

              </div>

              <img src="img/1.gif" data-src="img/portfolio/${num}-small.jpg" class="img-responsive" alt="Project Title"> </a> </div>

          </div>

        </div>`;

  });

  $('.portfolio-items').html(html);

  // Load all portfolio thumbnails immediately
  $('.portfolio-items img').each(function() {
    if ($(this).attr('src') === 'img/1.gif') {
      $(this).attr('src', $(this).data('src'));
    }
  });

  loadImages(); // Re-initialize lazy loading for any other images

  // Initialize Nivo Lightbox for the new items
  $('.portfolio-item a').nivoLightbox({
    effect: 'slideDown',
    keyboardNav: true
  });

});

</script>
